/* Layout: one portrait arcade cabinet screen, canvas game + HTML overlays on top. Single deliberate neon-night look. */
:root{
  --night:#0a0920;
  --deep:#141238;
  --panel:#17143f;
  --line:#3a2f7a;
  --ink:#f3f0ff;
  --mute:#a9a2d8;
  --cyan:#3ff1ff;
  --magenta:#ff4fd8;
  --gold:#ffe45c;
  --red:#ff4a5a;
  --px:"Cubic 11", "Courier New", monospace;
  --zh:"Cubic 11", "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-synthesis:none;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--ink);font-family:var(--zh);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0;box-sizing:border-box;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
#app{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;aspect-ratio:390/720;height:100%;max-height:100%;max-width:100%;
  box-shadow:0 0 0 1px var(--line), 0 0 60px rgba(255,79,216,.18)}
@media (max-aspect-ratio:390/720){#stage{height:auto;width:100%}}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:22px;box-sizing:border-box;background:rgba(10,9,32,.82);text-align:center;overflow-y:auto}
.ov.clear{background:transparent;pointer-events:none}
.ov.clear .card{pointer-events:auto}
.logo{font-family:var(--zh);font-weight:900;font-size:clamp(28px,9vw,40px);line-height:1.1;letter-spacing:.04em;
  color:var(--ink);text-shadow:0 0 12px var(--magenta), 3px 3px 0 var(--magenta)}
.logo small{display:block;font-family:var(--px);font-size:11px;letter-spacing:.2em;color:var(--cyan);
  text-shadow:0 0 8px var(--cyan);margin-top:10px}
.card{background:var(--panel);border:2px solid var(--cyan);box-shadow:0 0 0 4px var(--night),0 0 0 6px var(--magenta),0 0 30px rgba(63,241,255,.35);
  padding:18px 18px;max-width:320px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.card p{margin:0;font-size:17px;font-weight:700;line-height:1.55;text-wrap:balance}
.card .em{color:var(--gold)}
label.lbl{font-family:var(--px);font-size:11px;letter-spacing:.15em;color:var(--mute);text-align:left}
input#nick{font:700 18px var(--zh);background:var(--night);color:var(--ink);border:2px solid var(--line);
  padding:10px 12px;outline:none;width:100%;box-sizing:border-box}
input#nick:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(63,241,255,.4)}
.btn{font:900 17px var(--zh);color:var(--night);background:var(--cyan);border:0;padding:12px 16px;cursor:pointer;
  box-shadow:4px 4px 0 var(--magenta);letter-spacing:.06em}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--magenta)}
.btn:focus-visible,.tab:focus-visible,.ghost:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.alt{background:var(--magenta);color:var(--ink);box-shadow:4px 4px 0 var(--cyan)}
.ghost{font:700 14px var(--zh);background:transparent;color:var(--mute);border:1px solid var(--line);padding:9px 12px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row>*{flex:1 1 120px}
.err{color:var(--red);font-size:13px;min-height:1em;margin:0;font-weight:700}
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.stat span{font-size:15px;font-weight:700;color:var(--mute)}
.stat b{font-family:var(--px);font-size:26px;color:var(--gold);text-shadow:0 0 10px rgba(255,228,92,.5);font-weight:400}
.stat.bad b{color:var(--magenta);text-shadow:0 0 10px rgba(255,79,216,.5)}
.honor{font-weight:900;font-size:16px;color:var(--cyan);line-height:1.5}
.honor .no{font-family:var(--px);font-size:14px;color:var(--ink);display:block;margin-top:4px}
.policy{margin:0;border:2px solid var(--line);background:var(--deep);padding:12px 12px 12px 30px;color:var(--ink);font-size:14px;line-height:1.6;text-align:left;display:flex;flex-direction:column;gap:8px}
.policy li::marker{color:var(--magenta)}
.policy b{color:var(--gold);font-weight:400}
.tabs{display:flex;gap:6px}
.tab{flex:1;font:900 14px var(--zh);padding:9px 6px;background:var(--night);color:var(--mute);border:2px solid var(--line);cursor:pointer}
.tab[aria-selected="true"]{color:var(--night);background:var(--gold);border-color:var(--gold)}
ol.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:220px}
ol.board li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 8px;background:var(--deep);font-weight:700;font-size:15px}
ol.board li .r{font-family:var(--px);font-size:11px;color:var(--mute)}
ol.board li:nth-child(1) .r{color:var(--gold)}
ol.board li .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.board li .v{font-family:var(--px);font-size:12px;color:var(--cyan);font-variant-numeric:tabular-nums}
ol.board li.me{outline:2px solid var(--magenta)}
ol.board .empty{background:none;display:block;color:var(--mute);font-size:14px;text-align:center;padding:30px 0}
.note{font-size:12px;color:var(--mute);margin:0;line-height:1.5}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>

</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="老屋電梯大作戰遊戲畫面"></canvas>

    <div class="ov" id="ovTitle">
      <div class="logo">老屋電梯<br>大作戰<small>ELEVATOR RUSH</small></div>
      <div class="card">
        <label class="lbl" for="nick">PLAYER ID · 工程隊員代號</label>
        <input id="nick" maxlength="10" autocomplete="off" placeholder="輸入你的代號">
        <p class="err" id="nickErr"></p>
        <button class="btn" id="btnStart">出發施工</button>
        <button class="ghost" id="btnBoardT">排行榜</button>
      </div>
    </div>

    <div class="ov clear" id="ovIntro" hidden>
      <div class="card" style="margin-top:auto;margin-bottom:24px">
        <p id="introText">沒有電梯，阿嬤只能自己爬樓梯，<span class="em">幫幫阿嬤！</span></p>
        <button class="btn" id="btnIntro">連按畫面，幫她下樓</button>
      </div>
    </div>

    <div class="ov" id="ovResult" hidden>
      <div class="card">
        <div class="stat"><span>幫阿嬤下樓</span><b id="rHelp">0</b></div>
        <div class="stat bad"><span>害阿嬤補爬</span><b id="rClimb">0</b></div>
        <div class="honor">老屋電梯大作戰<span class="no" id="rNo">第 ─ 號榮譽隊員</span></div>
        <ul class="policy">
          <li>台北老屋增設電梯<b>案件量全國第一</b>，申請案量近三年平均每年是上任前的<b>三倍</b></li>
          <li>符合條件者補助最高<b>八成</b>、上限<b>480 萬</b></li>
        </ul>
        <div class="row">
          <button class="btn" id="btnAgain">再玩一次</button>
          <button class="btn alt" id="btnBoardR">排行榜</button>
        </div>
      </div>
    </div>

    <div class="ov" id="ovBoard" hidden>
      <div class="card">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tabThank" aria-selected="true">阿嬤感謝榜</button>
          <button class="tab" role="tab" id="tabClimb" aria-selected="false">阿嬤還在爬榜</button>
        </div>
        <p class="note" id="boardDesc">單場幫最多阿嬤下樓的隊員</p>
        <ol class="board" id="board"></ol>
        <p class="note" id="boardSrc"></p>
        <button class="ghost" id="btnBoardClose">返回</button>
      </div>
    </div>
  </div>
</div>

const ZH = '"Cubic 11","PingFang TC","Microsoft JhengHei",sans-serif';

// ---------- storage helpers ----------
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ---------- audio ----------
let actx = null, muted = false;
function beep(freq, dur = 0.08, type = "square", vol = 0.05, when = 0){
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch {}
}
const sfx = {
  drop(){ beep(220, .07, "square", .04); },
  land(){ beep(330, .06); beep(440, .06, "square", .04, .05); },
  perfect(){ [523,659,784,1047].forEach((f,i)=>beep(f,.09,"square",.05,i*.06)); },
  fail(){ beep(160,.25,"sawtooth",.06); beep(110,.3,"sawtooth",.05,.12); },
  step(){ beep(180 + Math.random()*60, .03, "triangle", .06); },
  done(){ [392,523,659,784,659,1047].forEach((f,i)=>beep(f,.1,"square",.05,i*.08)); },
  bear(){ beep(90,.15,"sawtooth",.07); beep(70,.2,"sawtooth",.06,.12); }
};

function drawSprite(name, x, y, px = 3, flip = false, wave = false){
  const rows = SPR[name]; const w = rows[0].length;
  for (let r = 0; r < rows.length; r++){
    for (let c = 0; c < w; c++){
      const ch = rows[r][c]; if (ch === ".") continue;
      ctx.fillStyle = PAL[ch];
      const cx = flip ? (w - 1 - c) : c;
      ctx.fillRect(Math.round(x + cx*px), Math.round(y + r*px), px, px);
    }
  }
  if (wave){ // waving hand above the head
    ctx.fillStyle = PAL.s;
    const up = Math.floor(performance.now()/220) % 2;
    ctx.fillRect(Math.round(x + (w-1)*px + px), Math.round(y + (up ? 2 : 4)*px), px, px*2);
  }
}
const spriteW = (n, px=3) => SPR[n][0].length * px;
const spriteH = (n, px=3) => SPR[n].length * px;

// ---------- world ----------
let state = "title";       // title | intro | introDone | play | overview | result
let buildings = [];
let cur = 0;               // current building index
let phase = "swing";       // swing | drop | bonus | tip | hop | ride | climb | exit | pan
let phaseT = 0;
let timeLeft = GAME_TIME, elapsed = 0;
let helped = 0, climbed = 0;
let camX = 0, camS = 1, camTX = 0, camTS = 1;
let hang = null, falling = null, junk = [];
let parts = [], pops = [];
let bear = {on:false, t:0, next:0};
let flash = 0, shake = 0, subsidyCard = 0;
let grand = null;          // {kind, x, y, mode}
let climbTarget = 0, climbTaps = 0, tapsPerFloor = TAPS_GAME;
let pend = {phase:0, speed:2.6};
let nick = LS.get("elev.nick", "");
let lastRun = null;

function bx(i){ return 40 + i*GAP; }               // building left
function sx(i){ return bx(i) + BW + 8 + SW/2; }    // shaft center
function floorY(f){ return GROUND - (f-1)*FH; }    // feet y of floor f (1..5)
function newBuilding(i){
  return {segs:[], status:"open", k:0, kind: KINDS[Math.floor(Math.random()*KINDS.length)], lit:0, hue: Math.random()};
}
function camFor(i){ return bx(i) + 122 - W/2; }

// ---------- stack physics (visual sway) ----------
function com(b){ if (!b.segs.length) return 0; return b.segs.reduce((a,s)=>a+s.x,0)/b.segs.length; }
function swayAt(b, level, t){ // horizontal offset at given stack level (1..n)
  const n = b.segs.length;
  const amp = 2 + n*2.2 + Math.abs(com(b))*0.4;
  let s = Math.sin(t*1.8) * amp * (level / FLOORS);
  if (bear.on) s += Math.sin(t*9) * 15 * (0.5 + level/FLOORS);
  return s;
}
function topX(b){ return b.segs.length ? b.segs[b.segs.length-1].x : 0; }

// ---------- flow ----------
function resetGame(){
  buildings = [newBuilding(0)];
  cur = 0; helped = 0; climbed = 0; timeLeft = GAME_TIME; elapsed = 0;
  parts = []; pops = []; junk = []; falling = null;
  bear = {on:false, t:0, next: BEAR_AFTER + 1 + Math.random()*3};
  camX = camTX = camFor(0); camS = camTS = 1;
}
function startBuilding(){
  const b = buildings[cur];
  grand = {kind:b.kind.key, f:5, x: bx(cur)+18, y: floorY(5), mode:"window"};
  pend.speed = Math.min(5.6, 2.5 + cur*0.32);
  pend.phase = Math.random()*Math.PI*2;
  newHang(); phase = "swing"; phaseT = 0;
}
function newHang(){ hang = {t0: performance.now()/1000}; }
function hangX(t){ return sx(cur) + Math.sin(pend.phase + t*pend.speed) * 78; }
const HANG_Y = 118; // top of hanging segment (screen/world y)

function tap(){
  if (state === "intro"){ climbStep(); return; }
  if (state !== "play") return;
  if (phase === "swing") dropSeg();
  else if (phase === "climb") climbStep();
}
function dropSeg(){
  const t = performance.now()/1000;
  falling = {x: hangX(t), y: HANG_Y, vy: 60, bonus:false};
  hang = null; phase = "drop"; sfx.drop();
}
function landSeg(){
  const b = buildings[cur];
  const n = b.segs.length;
  const t = performance.now()/1000;
  const target = sx(cur) + topX(b) + (n ? swayAt(b, n, t) : 0);
  let dx = falling.x - target;
  const acc = 1 - Math.abs(dx)/SW;
  const landY = GROUND - n*FH;
  if (acc < MISS && !falling.bonus){
    junk.push({x:falling.x, y:landY - FH, vx: dx>0?90:-90, vy:-120, rot:0, vr: dx>0?3:-3, ci:n});
    falling = null; failBuilding("歪掉了！"); return;
  }
  const perfect = falling.bonus || acc >= PERFECT;
  if (perfect && !falling.bonus) dx = 0;
  if (falling.bonus) dx = 0;
  b.segs.push({x: topX(b) + dx, acc});
  const wasBonus = falling.bonus;
  falling = null;
  const segY = GROUND - (n+1)*FH;
  if (perfect && !wasBonus){
    sfx.perfect();
    burst(sx(cur), segY + 10, 26, true);
    pops.push({text:"PERFECT!", x:sx(cur), y:segY - 18, t:0, c:"#ffe45c", px:true});
  } else if (wasBonus){
    sfx.land();
    pops.push({text:"BONUS!", x:sx(cur), y:segY - 8, t:0, c:"#3ff1ff", px:true});
    subsidyCard = 1.8;
    burst(sx(cur), segY + 10, 14, true);
  } else {
    sfx.land();
    pops.push({text: Math.round(acc*100)+"%", x:sx(cur), y:segY - 10, t:0, c:"#f3f0ff", px:true});
  }
  shake = 3;
  // balance check
  if (Math.abs(com(b)) > TIP*SW && b.segs.length > 1){
    const s = b.segs.pop();
    junk.push({x: sx(cur)+s.x, y: segY, vx: s.x>0?110:-110, vy:-80, rot:0, vr: s.x>0?2.5:-2.5, ci:b.segs.length});
    failBuilding("失去平衡！"); return;
  }
  if (b.segs.length >= FLOORS){ completeBuilding(); return; }
  if (perfect && !wasBonus){
    falling = {x: sx(cur) + topX(b), y: HANG_Y - 40, vy: 120, bonus:true};
    phase = "bonus"; return;
  }
  newHang(); phase = "swing";
}
function failBuilding(msg){
  const b = buildings[cur];
  b.k = b.segs.length; b.status = "partial";
  sfx.fail(); shake = 8; flash = 0.25;
  pops.push({text:msg, x:sx(cur), y: GROUND - b.k*FH - 40, t:0, c:"#ff4a5a"});
  climbTarget = Math.max(b.k, 1);
  climbTaps = 0; tapsPerFloor = TAPS_GAME;
  grand.mode = "stairs"; grand.x = bx(cur) + BW - 30; grand.y = floorY(5);
  phase = "climb"; phaseT = 0;
}
function completeBuilding(){
  const b = buildings[cur];
  b.k = FLOORS; b.status = "done";
  sfx.done(); flash = 0.5;
  for (let i=0;i<5;i++) setTimeout(()=>burst(sx(cur) + (Math.random()-.5)*160, GROUND - 120 - Math.random()*260, 18, true), i*120);
  pops.push({text:"電梯完工！", x:bx(cur)+122, y: GROUND - FLOORS*FH - 60, t:0, c:"#ffe45c", big:true});
  grand.mode = "hop"; phase = "hop"; phaseT = 0;
}
function climbStep(){
  const target = state === "intro" ? 1 : climbTarget;
  if (grand.f <= target) return;
  climbTaps++; sfx.step();
  grand.bob = 1;
  const per = state === "intro" ? TAPS_INTRO : tapsPerFloor;
  if (climbTaps >= per){
    climbTaps = 0; grand.f--;
    if (state === "play"){ climbed++; pops.push({text:"+1 層", x:grand.x, y:floorY(grand.f)-50, t:0, c:"#ff4fd8"}); }
    if (grand.f <= target){
      if (state === "intro"){ introFinished(); return; }
      if (grand.f > 1){ grand.mode = "hop"; phase = "hop"; phaseT = 0; }
      else { grand.mode = "exit"; phase = "exit"; phaseT = 0; }
    }
  }
}
function nextBuilding(){
  helped++;
  cur++;
  buildings.push(newBuilding(cur));
  camTX = camFor(cur);
  phase = "pan"; phaseT = 0;
}

// ---------- particles ----------
function burst(x, y, n, stars){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = 80 + Math.random()*220;
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 80, life: .7 + Math.random()*.6, t:0,
      c: ["#ffe45c","#3ff1ff","#ff4fd8","#ffffff"][i%4], star: stars && i%2===0});
  }
}

// ---------- drawing ----------
function drawBackground(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#07061a"); g.addColorStop(.55,"#1a0f4a"); g.addColorStop(.82,"#3b1466"); g.addColorStop(1,"#0a0920");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // stars
  for (let i=0;i<46;i++){
    const x = (i*97.3 + 13) % W, y = (i*53.7) % (H*0.55);
    const tw = 0.4 + 0.6*Math.abs(Math.sin(t*1.3 + i));
    ctx.fillStyle = `rgba(200,220,255,${tw*0.8})`;
    ctx.fillRect(x, y, i%7===0?2:1, i%7===0?2:1);
  }
  // sun
  const sunY = GROUND - 150;
  const sg = ctx.createLinearGradient(0, sunY-90, 0, sunY+40);
  sg.addColorStop(0,"#ffe45c"); sg.addColorStop(1,"#ff4fd8");
  ctx.save(); ctx.globalAlpha = .55; ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(W*0.72, sunY, 70, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#1a0f4a";
  for (let i=0;i<5;i++) ctx.fillRect(W*0.72-72, sunY - 10 - i*13, 144, 3 + i*0.4);
  ctx.restore();
  // mountains
  ctx.fillStyle = "#14093a";
  ctx.beginPath(); ctx.moveTo(0, GROUND-60);
  const pts = [[30,GROUND-95],[70,GROUND-70],[120,GROUND-118],[170,GROUND-78],[220,GROUND-100],[280,GROUND-66],[330,GROUND-108],[390,GROUND-72]];
  pts.forEach(p=>ctx.lineTo(p[0],p[1])); ctx.lineTo(W,GROUND); ctx.lineTo(0,GROUND); ctx.fill();
  // grid floor
  ctx.fillStyle = "#120a33"; ctx.fillRect(0, GROUND, W, H-GROUND);
  ctx.strokeStyle = "rgba(255,79,216,.55)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,GROUND+.5); ctx.lineTo(W,GROUND+.5); ctx.stroke();
  ctx.strokeStyle = "rgba(160,70,255,.35)";
  const off = ((camX*0.6) % 40 + 40) % 40;
  for (let i=-14;i<=24;i++){
    const xTop = i*40 - off;
    ctx.beginPath(); ctx.moveTo(xTop, GROUND); ctx.lineTo(W/2 + (xTop - W/2)*3.2, H); ctx.stroke();
  }
  for (let j=1;j<8;j++){
    const y = GROUND + Math.pow(j/8, 1.7)*(H-GROUND);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
}

function drawBuilding(i, t){
  const b = buildings[i]; const x0 = bx(i); const top = GROUND - FLOORS*FH - 14;
  const done = b.status === "done";
  // depth side
  ctx.fillStyle = done ? "#2a1f63" : "#1c1646";
  ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(x0+10, top-8); ctx.lineTo(x0+BW+10, top-8); ctx.lineTo(x0+BW, top); ctx.fill();
  // body
  const bg = ctx.createLinearGradient(0, top, 0, GROUND);
  if (done){ bg.addColorStop(0,"#3a2d86"); bg.addColorStop(1,"#241a5c"); }
  else { bg.addColorStop(0,"#2a2266"); bg.addColorStop(1,"#18123f"); }
  ctx.fillStyle = bg; ctx.fillRect(x0, top, BW, GROUND-top);
  // neon outline
  ctx.save();
  ctx.shadowColor = done ? "#3ff1ff" : "#ff4fd8"; ctx.shadowBlur = done ? 14 : 6;
  ctx.strokeStyle = done ? "#3ff1ff" : "rgba(255,79,216,.7)"; ctx.lineWidth = 2;
  ctx.strokeRect(x0+1, top+1, BW-2, GROUND-top-1);
  ctx.restore();
  // floor lines + windows
  for (let f=1; f<=FLOORS; f++){
    const yb = floorY(f), yt = yb - FH;
    ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.fillRect(x0, yt, BW, 3);
    for (let w=0; w<2; w++){
      const wx = x0 + 12 + w*52, wy = yt + 16;
      const on = done || (i*7 + f*3 + w) % 4 === 0;
      ctx.fillStyle = on ? (done ? "#ffd86b" : "#4a3a8a") : "#120d33";
      ctx.fillRect(wx, wy, 40, 34);
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(wx+19, wy, 2, 34);
      // balcony bars
      ctx.fillStyle = "#5b4fa6"; ctx.fillRect(wx-3, wy+34, 46, 3);
    }
    // stairwell slit
    ctx.fillStyle = "#0d0a28"; ctx.fillRect(x0 + BW - 38, yt + 10, 24, FH - 14);
  }
  // door
  ctx.fillStyle = "#0d0a28"; ctx.fillRect(x0 + BW - 40, GROUND - 46, 28, 46);
  // number plate
  ctx.fillStyle = done ? "#3ff1ff" : "#ff4fd8";
  ctx.font = `11px ${PX}`; ctx.textAlign = "left";
  ctx.fillText(String(i+1).padStart(2,"0"), x0 + 8, GROUND - 6);
  if (done){
    ctx.save(); ctx.translate(x0 + 70, top - 26); ctx.rotate(-0.06);
    ctx.fillStyle = "#ffe45c"; ctx.fillRect(-46,-14,92,28);
    ctx.fillStyle = "#0a0920"; ctx.font = `16px ${ZH}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("電梯完工", 0, 1); ctx.restore(); ctx.textBaseline = "alphabetic";
  }
}

function drawShaftZone(i){
  const x = sx(i) - SW/2;
  ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle = "rgba(63,241,255,.35)"; ctx.lineWidth = 1.5;
  ctx.strokeRect(x, GROUND - FLOORS*FH, SW, FLOORS*FH);
  ctx.restore();
  ctx.fillStyle = "rgba(63,241,255,.06)"; ctx.fillRect(x, GROUND - FLOORS*FH, SW, FLOORS*FH);
  ctx.fillStyle = "rgba(63,241,255,.7)"; ctx.font = `11px ${PX}`; ctx.textAlign = "center";
  ctx.fillText("ELEVATOR", sx(i), GROUND + 14);
}

function drawSeg(cx, yBottom, ci, alpha = 1, glow = false){
  const [c1, c2] = SEG_COLORS[Math.min(ci, SEG_COLORS.length-1)];
  const x = cx - SW/2, y = yBottom - FH;
  ctx.save(); ctx.globalAlpha = alpha;
  // top face
  ctx.fillStyle = c2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+10, y-8); ctx.lineTo(x+SW+10, y-8); ctx.lineTo(x+SW, y); ctx.closePath(); ctx.fill();
  // side face
  ctx.fillStyle = shade(c1, -0.35);
  ctx.beginPath(); ctx.moveTo(x+SW, y); ctx.lineTo(x+SW+10, y-8); ctx.lineTo(x+SW+10, yBottom-8); ctx.lineTo(x+SW, yBottom); ctx.closePath(); ctx.fill();
  // front
  const g = ctx.createLinearGradient(x, 0, x+SW, 0);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(x, y, SW, FH);
  // glass panel
  ctx.fillStyle = "rgba(10,9,32,.38)"; ctx.fillRect(x+10, y+9, SW-20, FH-18);
  ctx.fillStyle = "rgba(255,255,255,.22)"; ctx.fillRect(x+14, y+12, 6, FH-26);
  ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.fillRect(x, y, SW, 2);
  if (glow){ ctx.shadowColor = c2; ctx.shadowBlur = 18; ctx.strokeStyle = c2; ctx.lineWidth = 2; ctx.strokeRect(x, y, SW, FH); }
  ctx.restore();
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r = n>>16, g = (n>>8)&255, b = n&255;
  r = Math.round(r*(1+amt)); g = Math.round(g*(1+amt)); b = Math.round(b*(1+amt));
  return `rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`;
}

function drawStack(i, t){
  const b = buildings[i];
  b.segs.forEach((s, idx) => {
    const sway = (i === cur && state === "play") ? swayAt(b, idx+1, t) : 0;
    drawSeg(sx(i) + s.x + sway, GROUND - idx*FH, idx, 1, b.status === "done");
  });
  if (b.status === "done" || b.status === "partial"){
    // elevator car
    let carF = Math.max(b.k, 1);
    if (i === cur && grand && (phase === "ride")) carF = grand.carF;
    if (b.k >= 2 || (b.status === "done")){
      const top = b.segs[Math.max(0, Math.min(b.segs.length-1, Math.round(carF)-1))];
      const cx = sx(i) + (top ? top.x : 0);
      const yb = GROUND - (carF-1)*FH;
      ctx.save(); ctx.shadowColor = "#ffe45c"; ctx.shadowBlur = 16;
      ctx.fillStyle = "rgba(255,228,92,.85)"; ctx.fillRect(cx - 22, yb - FH + 14, 44, FH - 18);
      ctx.restore();
    }
  }
}

function drawCrane(t){
  const x = sx(cur);
  ctx.strokeStyle = "#ff4fd8"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bx(cur) - 20, 54); ctx.lineTo(bx(cur) + 360, 54); ctx.stroke();
  ctx.strokeStyle = "rgba(255,79,216,.5)"; ctx.lineWidth = 1;
  for (let k = bx(cur) - 20; k < bx(cur) + 360; k += 14){ ctx.beginPath(); ctx.moveTo(k, 54); ctx.lineTo(k+7, 62); ctx.lineTo(k+14, 54); ctx.stroke(); }
  if (hang && phase === "swing"){
    const hx = hangX(t - hang.t0 + hang.t0);
    ctx.fillStyle = "#ffe45c"; ctx.fillRect(hx - 12, 48, 24, 10);
    ctx.strokeStyle = "#d8d4e8"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hx, 58); ctx.lineTo(hx, HANG_Y - 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx, HANG_Y - 12); ctx.lineTo(hx - 24, HANG_Y - 8); ctx.moveTo(hx, HANG_Y - 12); ctx.lineTo(hx + 24, HANG_Y - 8); ctx.stroke();
    drawSeg(hx, HANG_Y + FH, buildings[cur].segs.length);
    // aim guide
    ctx.save(); ctx.setLineDash([3,6]); ctx.strokeStyle = "rgba(255,228,92,.35)";
    ctx.beginPath(); ctx.moveTo(hx, HANG_Y + FH + 4); ctx.lineTo(hx, GROUND - buildings[cur].segs.length*FH - 10); ctx.stroke(); ctx.restore();
  } else {
    ctx.fillStyle = "#ffe45c"; ctx.fillRect(x - 12, 48, 24, 10);
  }
}

function drawGrand(t){
  if (!grand) return;
  const b = buildings[cur];
  const name = grand.kind;
  const sw = spriteW(name), sh = spriteH(name);
  let gx = grand.x, gy = grand.y;
  const bob = grand.bob ? -3 : 0;
  if (grand.mode === "window"){
    gx = bx(cur) + 14; gy = floorY(5) - FH + 18;
    drawSprite(name, gx, gy, 3, false, true);
    // speech
    if (phase === "swing" || phase === "drop" || phase === "bonus"){
      ctx.font = `12px ${ZH}`; ctx.textAlign = "left";
      const txt = KINDS.find(k=>k.key===name).name + "要下樓買菜";
      const tw = ctx.measureText(txt).width + 12;
      ctx.fillStyle = "rgba(10,9,32,.85)"; ctx.fillRect(gx - 4, gy - 28, tw, 20);
      ctx.strokeStyle = "#3ff1ff"; ctx.lineWidth = 1; ctx.strokeRect(gx - 4 + .5, gy - 28 + .5, tw, 20);
      ctx.fillStyle = "#f3f0ff"; ctx.fillText(txt, gx + 2, gy - 13);
    }
    return;
  }
  if (grand.mode === "stairs"){
    const targetY = floorY(grand.f);
    grand.y += (targetY - grand.y) * 0.25;
    drawSprite(name, bx(cur) + BW - 36 + (grand.f % 2 ? 0 : 4), grand.y - sh + bob, 3, grand.f % 2 === 0);
    grand.bob = 0;
    return;
  }
  if (grand.mode === "ride" || grand.mode === "hop"){
    const carF = grand.carF ?? grand.f;
    const top = b.segs[Math.max(0, Math.min(b.segs.length-1, Math.round(carF)-1))];
    const cx = sx(cur) + (top ? top.x : 0);
    drawSprite(name, cx - sw/2, GROUND - (carF-1)*FH - sh - 4, 3);
    return;
  }
  if (grand.mode === "exit"){
    drawSprite(name, grand.x, GROUND - sh, 3);
    // basket
    ctx.fillStyle = "#b37a3a"; ctx.fillRect(grand.x + sw - 2, GROUND - sh/2, 10, 8);
    ctx.fillStyle = "#4fd36b"; ctx.fillRect(grand.x + sw, GROUND - sh/2 - 4, 6, 4);
  }
}

function drawBear(t){
  if (!bear.on) return;
  const x = sx(cur) + SW/2 + 22 + Math.sin(t*20)*3;
  const y = GROUND - spriteH("bear",4) + (Math.floor(t*10)%2 ? -4 : 0);
  drawSprite("bear", x, y, 4);
  ctx.fillStyle = "rgba(10,9,32,.9)"; ctx.fillRect(x - 10, y - 30, 64, 22);
  ctx.strokeStyle = "#ff4a5a"; ctx.lineWidth = 2; ctx.strokeRect(x - 10, y - 30, 64, 22);
  ctx.fillStyle = "#ff4a5a"; ctx.font = `13px ${ZH}`; ctx.textAlign = "center";
  ctx.fillText("搖搖搖！", x + 22, y - 14);
}

function drawHUD(){
  // top bar
  ctx.fillStyle = "rgba(10,9,32,.72)"; ctx.fillRect(0, 0, W, 40);
  ctx.fillStyle = "#ff4fd8"; ctx.fillRect(0, 40, W, 2);
  ctx.textAlign = "left"; ctx.font = `11px ${PX}`; ctx.fillStyle = "#3ff1ff";
  ctx.fillText("TIME", 12, 17);
  const tl = Math.max(0, Math.ceil(timeLeft));
  ctx.font = `16px ${PX}`; ctx.fillStyle = tl <= 10 ? "#ff4a5a" : "#f3f0ff";
  ctx.fillText(String(tl).padStart(2,"0"), 12, 36);
  ctx.textAlign = "center"; ctx.font = `13px ${ZH}`; ctx.fillStyle = "#a9a2d8";
  ctx.fillText(`第 ${cur+1} 棟`, W/2, 17);
  ctx.font = `11px ${PX}`; ctx.fillStyle = "#ffe45c";
  const n = buildings[cur] ? buildings[cur].segs.length : 0;
  ctx.fillText(`${n}/5F`, W/2, 34);
  ctx.textAlign = "right"; ctx.font = `12px ${ZH}`; ctx.fillStyle = "#a9a2d8";
  ctx.fillText("幫下樓", W - 46, 17); ctx.fillText("補爬", W - 46, 35);
  ctx.font = `12px ${PX}`; ctx.fillStyle = "#ffe45c"; ctx.fillText(String(helped), W - 12, 18);
  ctx.fillStyle = "#ff4fd8"; ctx.fillText(String(climbed), W - 12, 36);
  // timer bar
  ctx.fillStyle = "#3ff1ff"; ctx.fillRect(0, 42, W * Math.max(0,timeLeft)/GAME_TIME, 3);
  // bottom hint
  const hint = phase === "climb" ? "連按畫面，幫她爬下樓！" : (phase === "swing" ? "點一下，放下電梯井" : "");
  if (hint){
    ctx.textAlign = "center"; ctx.font = `15px ${ZH}`;
    ctx.fillStyle = phase === "climb" ? "#ff4fd8" : "#f3f0ff";
    if (phase !== "climb" || Math.floor(performance.now()/300)%2) ctx.fillText(hint, W/2, H - 22);
  }
  if (phase === "climb"){
    const per = tapsPerFloor;
    const w = 150; ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.fillRect(W/2 - w/2, H - 54, w, 8);
    ctx.fillStyle = "#ff4fd8"; ctx.fillRect(W/2 - w/2, H - 54, w * climbTaps/per, 8);
  }
}

function drawPopsAndParts(dt){
  parts = parts.filter(p => (p.t += dt) < p.life);
  parts.forEach(p => {
    p.vy += 420*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    ctx.globalAlpha = 1 - p.t/p.life; ctx.fillStyle = p.c;
    if (p.star){ drawStar(p.x, p.y, 5); } else ctx.fillRect(p.x, p.y, 3, 3);
  });
  ctx.globalAlpha = 1;
  pops = pops.filter(p => (p.t += dt) < 1.2);
  pops.forEach(p => {
    ctx.globalAlpha = 1 - Math.max(0, p.t - 0.6)/0.6;
    ctx.textAlign = "center";
    ctx.font = p.px ? `12px ${PX}` : `${p.big?24:16}px ${ZH}`;
    ctx.fillStyle = "#0a0920"; ctx.fillText(p.text, p.x + 2, p.y - p.t*30 + 2);
    ctx.fillStyle = p.c; ctx.fillText(p.text, p.x, p.y - p.t*30);
  });
  ctx.globalAlpha = 1;
}
function drawSubsidyCard(){
  if (subsidyCard <= 0) return;
  const age = 1.8 - subsidyCard;
  const pop = Math.min(1, age / 0.15);
  const a = Math.min(1, subsidyCard / 0.3);
  const w = 300, h = 58, x = (W - w)/2, y = 60 + (1 - pop)*-20;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = "#0a0920"; ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
  ctx.fillStyle = "#ff4fd8"; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = "#17143f"; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#3ff1ff"; ctx.lineWidth = 2; ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
  ctx.textAlign = "center";
  ctx.font = `11px ${PX}`; ctx.fillStyle = "#3ff1ff";
  ctx.fillText("★ 市府加裝電梯補助 ★", W/2, y + 22);
  ctx.font = `15px ${ZH}`; ctx.fillStyle = "#ffe45c";
  ctx.fillText("符合條件者最高補助八成、上限480萬", W/2, y + 44);
  ctx.restore();
}
function drawStar(x, y, r){
  ctx.beginPath();
  for (let i=0;i<10;i++){ const a = i*Math.PI/5 - Math.PI/2, rr = i%2 ? r*0.45 : r; ctx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr); }
  ctx.closePath(); ctx.fill();
}

// ---------- main loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const t = now/1000;
  update(dt, t);
  render(dt, t);
  requestAnimationFrame(frame);
}

function update(dt, t){
  camX += (camTX - camX) * Math.min(1, dt*6);
  camS += (camTS - camS) * Math.min(1, dt*4);
  if (shake > 0) shake = Math.max(0, shake - dt*30);
  if (flash > 0) flash = Math.max(0, flash - dt);
  if (subsidyCard > 0) subsidyCard = Math.max(0, subsidyCard - dt);
  junk = junk.filter(j => { j.vy += 900*dt; j.x += j.vx*dt; j.y += j.vy*dt; j.rot += j.vr*dt; return j.y < H + 200; });
  if (state !== "play") return;

  timeLeft -= dt; elapsed += dt;
  if (timeLeft <= 0){ timeLeft = 0; endGame(); return; }

  // bear
  if (elapsed >= BEAR_AFTER){
    if (bear.on){ bear.t += dt; if (bear.t > 2.6){ bear.on = false; bear.next = elapsed + 3.5 + Math.random()*4; } }
    else if (elapsed >= bear.next && (phase === "swing" || phase === "drop")){ bear.on = true; bear.t = 0; sfx.bear(); }
  }

  phaseT += dt;
  const b = buildings[cur];
  if ((phase === "drop" || phase === "bonus") && falling){
    falling.vy += 2200*dt; falling.y += falling.vy*dt;
    const landTop = GROUND - (b.segs.length+1)*FH;
    if (falling.y >= landTop){ falling.y = landTop; landSeg(); }
  } else if (phase === "hop"){
    // walk into car at current floor
    grand.carF = grand.mode === "hop" && b.status === "done" ? 5 : grand.f;
    if (phaseT > 0.35){ grand.mode = "ride"; phase = "ride"; phaseT = 0; grand.carStart = grand.carF; }
  } else if (phase === "ride"){
    const dur = 0.25 + 0.18*(grand.carStart - 1);
    const p = Math.min(1, phaseT/dur);
    grand.carF = grand.carStart - (grand.carStart - 1) * (p*p*(3-2*p));
    if (p >= 1){ grand.mode = "exit"; grand.x = sx(cur) - spriteW(grand.kind)/2; phase = "exit"; phaseT = 0; }
  } else if (phase === "exit"){
    if (grand.mode !== "exit"){ grand.mode = "exit"; grand.x = bx(cur) + BW - 36; }
    grand.x += 150*dt;
    if (phaseT > 0.55){ pops.push({text:"阿嬤 +1", x:grand.x, y:GROUND - 70, t:0, c:"#ffe45c"}); nextBuilding(); }
  } else if (phase === "pan"){
    if (phaseT > 0.55){ startBuilding(); }
  }
}

function render(dt, t){
  const r = cv.width / W;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  drawBackground(t);
  // world
  ctx.save();
  const sh = shake ? (Math.random()-.5)*shake : 0;
  ctx.translate(sh, 0);
  if (state === "overview" || state === "result"){
    ctx.translate(W/2, 0); ctx.scale(camS, camS);
    ctx.translate(-W/2 - camX, (GROUND)*(1/camS - 1));
  } else ctx.translate(-camX, 0);
  const wide = state === "overview" || state === "result";
  const lo = wide ? 0 : Math.max(0, Math.floor((camX - 60)/GAP));
  const hi = wide ? buildings.length - 1 : Math.min(buildings.length - 1, Math.ceil((camX + W)/GAP) + 1);
  for (let i = lo; i <= hi; i++){
    if (!buildings[i]) continue;
    if (i === cur && (state === "play" || state === "intro") && buildings[i].status === "open") drawShaftZone(i);
    drawBuilding(i, t);
    drawStack(i, t);
  }
  if (state === "play" || state === "intro" || state === "introDone"){
    if (state === "play") drawCrane(t);
    if (falling) drawSeg(falling.x, falling.y + FH, buildings[cur].segs.length, 1, falling.bonus);
    junk.forEach(j => { ctx.save(); ctx.translate(j.x, j.y); ctx.rotate(j.rot); drawSeg(0, FH/2, j.ci, .9); ctx.restore(); });
    if (state === "intro") drawIntroGrand();
    else drawGrand(t);
    drawBear(t);
  }
  drawPopsAndParts(dt);
  ctx.restore();
  if (flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash*0.5})`; ctx.fillRect(0,0,W,H); }
  if (state === "play"){ drawHUD(); drawSubsidyCard(); }
  if (state === "intro") drawIntroHUD();
  if (state === "overview" || state === "result") drawOverviewCaption();
}

// ---------- intro ----------
function drawIntroGrand(){
  const name = grand.kind, sh = spriteH(name);
  const targetY = floorY(grand.f);
  grand.y += (targetY - grand.y)*0.25;
  drawSprite(name, bx(0) + BW - 36 + (grand.f % 2 ? 0 : 4), grand.y - sh + (grand.bob ? -3 : 0), 3, grand.f % 2 === 0);
  grand.bob = 0;
}
function drawIntroHUD(){
  if (!introLive) return;
  ctx.textAlign = "center"; ctx.font = `16px ${ZH}`; ctx.fillStyle = "#ff4fd8";
  if (Math.floor(performance.now()/300)%2) ctx.fillText("連按！連按！", W/2, 80);
  ctx.font = `11px ${PX}`; ctx.fillStyle = "#f3f0ff";
  ctx.fillText(`${grand.f}F → 1F`, W/2, 104);
  const w = 160; ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.fillRect(W/2 - w/2, 114, w, 8);
  ctx.fillStyle = "#ff4fd8"; ctx.fillRect(W/2 - w/2, 114, w * climbTaps/TAPS_INTRO, 8);
}
let introLive = false;
function beginIntro(){
  resetGame();
  state = "intro"; introLive = false;
  grand = {kind:"grandma", f:5, x:0, y:floorY(5), mode:"stairs"};
  climbTaps = 0;
  $("introText").innerHTML = '沒有電梯，阿嬤只能自己爬樓梯，<span class="em">幫幫阿嬤！</span>';
  $("btnIntro").textContent = "連按畫面，幫她下樓";
  $("btnIntro").onclick = () => { $("ovIntro").hidden = true; introLive = true; };
  $("ovIntro").hidden = false;
}
function introFinished(){
  introLive = false; state = "introDone"; sfx.done();
  LS.set("elev.tutorial", true);
  $("introText").innerHTML = '手好痠吧？阿嬤每天都這樣爬。<br><span class="em">市府補助加裝電梯</span>，阿嬤就能輕鬆下樓！<br>60 秒內，幫越多阿嬤越好。';
  $("btnIntro").textContent = "開始施工";
  $("btnIntro").onclick = () => { $("ovIntro").hidden = true; beginPlay(false); };
  $("ovIntro").hidden = false;
}
function beginPlay(reset = true){
  if (reset) resetGame();
  else { buildings = [newBuilding(0)]; cur = 0; }
  state = "play";
  startBuilding();
}

// ---------- end ----------
function endGame(){
  if (phase === "exit") helped++;                         // she already reached the street
  if (phase === "pan" && cur > 0){ buildings.pop(); cur--; } // next building not started yet
  state = "overview"; hang = null; falling = null; bear.on = false;
  const b = buildings[cur];
  if (b.status === "open") b.status = "unfinished";
  const n = buildings.length;
  const span = bx(n-1) + BW + 60 - (bx(0) - 20);
  camTS = Math.min(1, W / (span + 20));
  camTX = (bx(0) - 20 + span/2) - W/2;
  sfx.fail();
  lastRun = {nick, helped, climbed, at: Date.now()};
  setTimeout(showResult, 2600);
  submitScore(lastRun);
}
function drawOverviewCaption(){
  const done = buildings.filter(b=>b.status==="done").length;
  const part = buildings.length - done;
  ctx.fillStyle = "rgba(10,9,32,.8)"; ctx.fillRect(0, 70, W, 70);
  ctx.textAlign = "center"; ctx.font = `12px ${PX}`; ctx.fillStyle = "#ffe45c";
  ctx.fillText("TIME UP!", W/2, 96);
  ctx.font = `15px ${ZH}`; ctx.fillStyle = "#f3f0ff";
  ctx.fillText(`電梯完工 ${done} 棟　沒裝好 ${part} 棟`, W/2, 124);
}
function showResult(){
  state = "result";
  $("rHelp").textContent = lastRun.helped;
  $("rClimb").textContent = lastRun.climbed;
  $("ovResult").hidden = false;
  $("btnAgain").focus();
}

// ---------- leaderboard (shared db, local fallback) ----------
let db = null, uid = null, myNo = null;
let boardData = {best: [], climbs: []}, boardMode = "best", boardShared = false;
function localRuns(){ return LS.get("elev.runs", []); }
function setLocalBoard(){
  const runs = localRuns();
  const byNick = {};
  runs.forEach(r => {
    const e = byNick[r.nick] || (byNick[r.nick] = {nick:r.nick, best:0, climbs:0});
    e.best = Math.max(e.best, r.helped); e.climbs += r.climbed;
  });
  const arr = Object.values(byNick);
  boardData.best = [...arr].sort((a,b)=>b.best-a.best).slice(0,10);
  boardData.climbs = [...arr].sort((a,b)=>b.climbs-a.climbs).slice(0,10);
}
async function initDb(){
  setLocalBoard();
  try {
    if (!window.claude || !window.claude.use) return;
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d) return;
    db = d;
    if (u) { try { uid = await u.id(); } catch {} }
    const subscribe = (field) => db.collection("scores").orderBy(field, "desc").limit(10).onSnapshot(snap => {
      boardShared = true;
      boardData[field] = snap.docs.map(s => ({id: s.id, ...s.data()}));
      renderBoard();
    }, () => {});
    subscribe("best"); subscribe("climbs");
    if (uid){
      const me = await db.doc("scores/" + uid).get();
      if (me.exists) myNo = me.data().no || null;
    }
  } catch {}
}
async function submitScore(run){
  const runs = localRuns(); runs.push(run); LS.set("elev.runs", runs.slice(-50));
  let localNo = LS.get("elev.no", null);
  if (!localNo){ localNo = 1000 + Math.floor(Math.random()*9000); LS.set("elev.no", localNo); }
  let no = myNo || localNo;
  if (db && uid){
    try {
      const ref = db.doc("scores/" + uid);
      const snap = await ref.get();
      const prev = snap.exists ? snap.data() : null;
      if (!prev){
        const all = await db.collection("scores").get();
        no = all.size + 1;
      } else no = prev.no || no;
      await ref.set({
        nick: run.nick, no,
        best: Math.max(prev ? prev.best || 0 : 0, run.helped),
        climbs: (prev ? prev.climbs || 0 : 0) + run.climbed,
        plays: (prev ? prev.plays || 0 : 0) + 1,
        updatedAt: new Date().toISOString()
      });
      myNo = no;
    } catch {}
  }
  if (!boardShared) setLocalBoard();
  $("rNo").textContent = `第 ${no} 號榮譽隊員`;
}
function renderBoard(){
  const ol = $("board"); ol.textContent = "";
  const list = boardData[boardMode];
  $("boardDesc").textContent = boardMode === "best" ? "單場幫最多阿嬤下樓的隊員" : "累計害阿嬤補爬最多層的隊員";
  $("boardSrc").textContent = boardShared ? "全體隊員即時排名" : "本機紀錄（目前無法連線共享排行榜）";
  if (!list.length){
    const li = document.createElement("li"); li.className = "empty";
    li.textContent = "還沒有紀錄，第一名就是你！"; ol.appendChild(li); return;
  }
  list.forEach((e, i) => {
    const li = document.createElement("li");
    if ((uid && e.id === uid) || (!boardShared && e.nick === nick)) li.className = "me";
    const r = document.createElement("span"); r.className = "r"; r.textContent = String(i+1).padStart(2,"0");
    const n = document.createElement("span"); n.className = "n"; n.textContent = e.nick || "無名隊員";
    const v = document.createElement("span"); v.className = "v";
    v.textContent = boardMode === "best" ? `${e.best||0}人` : `${e.climbs||0}層`;
    li.append(r, n, v); ol.appendChild(li);
  });
}
function openBoard(from){
  boardFrom = from;
  $("ovBoard").hidden = false; $(from).hidden = true; renderBoard();
}
let boardFrom = "ovTitle";
function setTab(mode){
  boardMode = mode;
  $("tabThank").setAttribute("aria-selected", mode === "best");
  $("tabClimb").setAttribute("aria-selected", mode === "climbs");
  renderBoard();
}

// ---------- UI wiring ----------
$("nick").value = nick;
$("btnStart").onclick = () => {
  const v = $("nick").value.trim();
  if (!v){ $("nickErr").textContent = "請先輸入隊員代號"; $("nick").focus(); return; }
  nick = v; LS.set("elev.nick", v); $("nickErr").textContent = "";
  $("ovTitle").hidden = true;
  beep(660,.08);
  if (LS.get("elev.tutorial", false)) beginPlay(true);
  else beginIntro();
};
$("nick").addEventListener("keydown", e => { if (e.key === "Enter") $("btnStart").click(); });
$("btnAgain").onclick = () => { $("ovResult").hidden = true; beginPlay(true); };
$("btnBoardT").onclick = () => openBoard("ovTitle");
$("btnBoardR").onclick = () => openBoard("ovResult");
$("btnBoardClose").onclick = () => { $("ovBoard").hidden = true; $(boardFrom).hidden = false; };
$("tabThank").onclick = () => setTab("best");
$("tabClimb").onclick = () => setTab("climbs");

cv.addEventListener("pointerdown", e => { e.preventDefault(); if (state === "intro" && !introLive) return; tap(); });
window.addEventListener("keydown", e => {
  if ((e.code === "Space" || e.code === "Enter") && (state === "play" || (state === "intro" && introLive))){
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    e.preventDefault(); tap();
  }
});

// title scene: show an idle building
resetGame();
grand = {kind:"grandma", f:5, x:0, y:floorY(5), mode:"window"};
resize();
initDb();
requestAnimationFrame(frame);
})();
</script>
