<style>
/* Layout: a dark screening room — the 9:16 phone is the stage, a narrow control column sits beside it (stacks under it on phones). Single dark look by design. */
:root {
  --stage: #17110f;      /* room */
  --panel: #221917;      /* control column */
  --ink: #f6eee8;        /* text */
  --muted: #b3a39a;      /* captions, notes */
  --brick: #b4462e;      /* 紅磚 accent */
  --brick-soft: #3a211b;
  --gold: #e9b44c;       /* beat / progress */
  --display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--stage); color: var(--ink); font-family: var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  box-sizing: border-box;
}
.wrap { display: flex; gap: 32px; justify-content: center; align-items: center; min-height: 100%; flex-wrap: wrap; }
.phone {
  position: relative; height: min(78vh, 760px); aspect-ratio: 9 / 16; max-width: 100%;
  border-radius: 28px; overflow: hidden; background: #000;
  box-shadow: 0 0 0 8px #0c0807, 0 30px 80px rgba(0,0,0,.55);
  touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab;
}
.phone:active { cursor: grabbing; }
.phone:focus-visible { outline: 3px solid var(--gold); outline-offset: 10px; }
.layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#next { clip-path: inset(0 100% 0 0); }
.edge { position: absolute; top: 0; bottom: 0; width: 3px; left: 0; background: rgba(255,255,255,.9);
  box-shadow: 0 0 18px 6px rgba(255,255,255,.45); opacity: 0; pointer-events: none; }
.tag { position: absolute; top: 18px; left: 16px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: rgba(0,0,0,.55); color: var(--ink); letter-spacing: .08em; }
.tag.now { background: var(--brick); }
.cap { position: absolute; left: 8%; right: 8%; bottom: 17%; text-align: center; font-weight: 900; line-height: 1.25;
  font-size: clamp(22px, 4.2vh, 38px); color: #fff; text-wrap: balance;
  text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); -webkit-text-stroke: 1px rgba(0,0,0,.6); }
.cap small { display: block; font-size: .55em; font-weight: 700; margin-top: 6px; }
.cap.pop { animation: pop .28s ease-out; }
@keyframes pop { from { transform: scale(1.18); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.bars { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 3px; }
.bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); }
.bars i.on { background: var(--gold); }
.guide { position: absolute; left: 10%; right: 10%; bottom: 34%; height: 110px; border-radius: 16px;
  background: rgba(0,0,0,.55); display: grid; place-items: end center; padding-bottom: 12px; font-weight: 700; font-size: 17px; }
.guide .track { position: absolute; left: 14%; right: 14%; top: 30px; border-top: 2px dashed rgba(255,255,255,.8); }
.guide .hand { position: absolute; top: 20px; left: 14%; font-size: 34px; animation: hand 1.4s ease-in-out infinite; }
@keyframes hand { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(calc(min(78vh,760px) * 9/16 * .5)); opacity: 0; } }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .18s ease-out; }
@keyframes flash { from { opacity: .35; } to { opacity: 0; } }

.side { width: min(340px, 100%); min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--muted); }
h1 { margin: 4px 0 0; font-size: 34px; font-weight: 900; text-wrap: balance; }
.meta { color: var(--muted); font-size: 14px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; font-weight: 700; font-size: 15px; border-radius: 12px; padding: 11px 16px; cursor: pointer;
  border: 1px solid var(--brick-soft); background: var(--panel); color: var(--ink); }
button.primary { background: var(--brick); border-color: var(--brick); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.how { background: var(--panel); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.7; color: var(--muted); }
.how b { color: var(--ink); }
.beat { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.beat i { width: 10px; height: 10px; border-radius: 50%; background: var(--brick-soft); }
.beat i.hit { background: var(--gold); }
.note { font-size: 12px; color: var(--muted); line-height: 1.7; }
.note a { color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .guide .hand, .cap.pop, .flash.go { animation: none; } }
@media (max-width: 760px) { .phone { height: min(72vh, 640px); } .side { width: 100%; } }
</style>

const $ = id => document.getElementById(id);
const cur = $("cur"), next = $("next"), edge = $("edge"), cap = $("cap"), tag = $("tag"), guide = $("guide"), phone = $("phone");
let i = 0, busy = false, auto = false, introDone = false;

$("bars").innerHTML = F.map(() => "<i></i>").join("");
function paint() {
  const f = F[i];
  cur.src = IMG[f.img];
  tag.textContent = f.tag; tag.hidden = !f.tag;
  tag.className = "tag" + (f.tag && f.tag !== "改造前" ? " now" : "");
  cap.innerHTML = f.cap || ""; cap.classList.remove("pop"); void cap.offsetWidth; if (f.cap) cap.classList.add("pop");
  guide.hidden = !(f.intro && !introDone);
  [...$("bars").children].forEach((b, k) => b.classList.toggle("on", k <= i));
}
function setReveal(p) {
  next.style.clipPath = `inset(0 ${100 - p * 100}% 0 0)`;
  edge.style.left = `calc(${p * 100}% - 1px)`; edge.style.opacity = p > 0 && p < 1 ? 1 : 0;
}
function prep() { if (i + 1 < F.length) next.src = IMG[F[i + 1].img]; setReveal(0); }
function commit() {
  i++; introDone = true; paint(); setReveal(0); prep();
  const fl = $("flash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
}
function animateTo(target, ms, done) {
  const from = parseFloat(next.dataset.p || 0), t0 = performance.now();
  busy = true;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function step(t) {
    const k = reduce ? 1 : Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3), p = from + (target - from) * e;
    next.dataset.p = p; setReveal(p);
    if (k < 1) requestAnimationFrame(step); else { busy = false; next.dataset.p = 0; done && done(); }
  })(t0);
}
function advance(ms = 260) { if (busy || i >= F.length - 1) return; guide.hidden = true; animateTo(1, ms, commit); }

// pointer swipe
let sx = null, w = 1;
phone.addEventListener("pointerdown", e => { if (auto || busy || i >= F.length - 1) return; sx = e.clientX; w = phone.clientWidth; phone.setPointerCapture(e.pointerId); guide.hidden = true; });
phone.addEventListener("pointermove", e => { if (sx === null) return; const p = Math.max(0, Math.min(1, (e.clientX - sx) / w)); next.dataset.p = p; setReveal(p); });
function release(e) {
  if (sx === null) return; const p = parseFloat(next.dataset.p || 0); sx = null;
  if (p > .33) animateTo(1, 180, commit); else if (p > 0) animateTo(0, 160, () => { if (F[i].intro && !introDone) guide.hidden = false; });
  else if (Math.abs(e.clientX - (e.clientX)) === 0 && p === 0) { /* tap: no-op */ }
}
phone.addEventListener("pointerup", release); phone.addEventListener("pointercancel", release);
addEventListener("keydown", e => { if (e.key === "ArrowRight" && !auto) advance(); });

let ac = null, timer = null;
function drum(t, kind) {

  else {
    const n = ac.createBufferSource(), buf = ac.createBuffer(1, ac.sampleRate * .05, ac.sampleRate), d = buf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / d.length);
    n.buffer = buf; const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = kind === "snare" ? 1500 : 7000;
    g.gain.value = kind === "snare" ? .5 : .18; n.connect(hp).connect(g).connect(ac.destination); n.start(t);
  }
}
function stop() { auto = false; clearTimeout(timer); $("play").textContent = "▶ 自動播放（含節拍）"; if (ac) { ac.close(); ac = null; } }
function play() {
  if (auto) return stop();
  i = 0; introDone = true; paint(); prep();
  auto = true; $("play").textContent = "■ 停止"; guide.hidden = true;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  const dur = f => f.hold || (f.fast ? 1 : f.intro ? 4 : 2);
  const starts = []; let acc = 0; F.forEach(f => { starts.push(acc); acc += dur(f); });
  const total = acc, beat = .5, dots = [...$("beat").querySelectorAll("i")];
  const t0 = ac ? ac.currentTime + .1 : 0, start = performance.now() + 100;
  let b = 0;
  (function tick() {
    if (!auto) return;
    if (ac) { const t = t0 + b * beat; drum(t, "kick"); drum(t + beat / 2, "hat"); if (b % 2) drum(t, "snare"); }
    dots.forEach((d, k) => d.classList.toggle("hit", k === b % 4));
    const k = starts.indexOf(b);
    if (k > 0 && i === k - 1) advance(150);
    b++;
    if (b > total) return stop();
    timer = setTimeout(tick, Math.max(0, start + b * beat * 1000 - performance.now()));
  })();
}
$("play").onclick = play;
$("reset").onclick = () => { stop(); i = 0; introDone = false; paint(); prep(); };
$("phone").addEventListener("click", () => {});
paint(); prep();
</script>
